services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - app_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
volumes:
  app_data:
